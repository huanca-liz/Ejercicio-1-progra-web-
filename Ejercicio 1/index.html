<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Transferencia de Calor</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div class="container">
        <h1>Cálculo de Temperatura</h1>
        <input type="number" id="T0" placeholder="Temperatura inicial (T0)">
        <input type="number" id="Ts" placeholder="Temperatura ambiente (Ts)">
        <input type="number" id="k" placeholder="Constante k" step="0.01">
        <input type="number" id="t" placeholder="Tiempo (horas)">
        <button onclick="calcular()">Calcular</button>
        <h2 id="resultado"></h2>
    </div>
    <script src="./JAVASCRIPT/EJEMPLO.JS"></script>

</body>

</html>
